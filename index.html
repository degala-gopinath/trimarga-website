<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRIMARGA — Business Growth Partners</title>
    <meta name="description" content="Trimarga builds your complete online presence - website, Google profile, social media and ads - so customers can find you, trust you, and reach you in one tap." />
    <meta name="theme-color" content="#0A0907" />
    <meta name="color-scheme" content="dark" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Link previews (WhatsApp, Instagram, LinkedIn, X). Deliberately no
         canonical or og:url: this is a single static shell shared by every
         route, so either would point all pages at the home page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trimarga" />
    <meta property="og:title" content="TRIMARGA — Business Growth Partners" />
    <meta property="og:description" content="Trimarga builds your complete online presence - website, Google profile, social media and ads - so customers can find you, trust you, and reach you in one tap." />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Trimarga — Business Growth Partners" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TRIMARGA — Business Growth Partners" />
    <meta name="twitter:description" content="Websites, Google profile, social media and ads — one team for your complete online presence." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Clash Display (Indian Type Foundry, free for commercial use) replaces
         Playfair Display, which reads as a template on agency sites. -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet" />
    <script>
      /* Scroll-reveal hides content until it animates in. Gate that on this
         class so the site degrades to fully visible if JS never runs or
         motion is not wanted — content must never be permanently hidden.
         Set before first paint to avoid a flash of visible content. */
      try {
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('js-motion');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#0A0907] text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
